parameters:
  nvidia_gpu_operator:
    =_metadata:
      multi_tenant: true

    install_method: olm

    namespace: nvidia-gpu-operator

    gpu_operator:
      namespace: "${nvidia_gpu_operator:namespace}"
      olm:
        version: stable
        channel: "${nvidia_gpu_operator:gpu_operator:olm:version}"
      cluster_policy_name: gpu-cluster-policy
      cluster_policy_spec:
        # NOTE(aa): The default spec is taken from the ClusterServiceVersion's `alm_examples` annotation
        # and is specific to OpenShift.
        # If we start supporting other install methods we need to customize this.
        operator:
          defaultRuntime: crio
          use_ocp_driver_toolkit: true
          initContainer: {}
        sandboxWorkloads:
          enabled: false
          defaultWorkload: container
        driver:
          enabled: true
          useNvidiaDriverCRD: false
          kernelModuleType: auto
          upgradePolicy:
            autoUpgrade: true
            drain:
              deleteEmptyDir: false
              enable: false
              force: false
              timeoutSeconds: 300
            maxParallelUpgrades: 1
            maxUnavailable: 25%
            podDeletion:
              deleteEmptyDir: false
              force: false
              timeoutSeconds: 300
            waitForCompletion:
              timeoutSeconds: 0
          repoConfig:
            configMapName: ""
          certConfig:
            name: ""
          licensingConfig:
            nlsEnabled: true
            configMapName: ""
          virtualTopology:
            config: ""
          kernelModuleConfig:
            name: ""
        dcgmExporter:
          enabled: true
          config:
            name: ""
          serviceMonitor:
            enabled: true
        dcgm:
          enabled: true
        daemonsets:
          updateStrategy: RollingUpdate
          rollingUpdate:
            maxUnavailable: "1"
        devicePlugin:
          enabled: true
          config:
            name: ""
            default: ""
          mps:
            root: /run/nvidia/mps
        gfd:
          enabled: true
        migManager:
          enabled: true
        nodeStatusExporter:
          enabled: true
        mig:
          strategy: single
        toolkit:
          enabled: true
        validator:
          plugin:
            env: []
        vgpuManager:
          enabled: false
        vgpuDeviceManager:
          enabled: true
        sandboxDevicePlugin:
          enabled: true
        vfioManager:
          enabled: true
        gds:
          enabled: false
        gdrcopy:
          enabled: false

    feature_discovery_operator:
      enabled: true
      namespace: openshift-nfd
      olm:
        version: stable
        channel: "${nvidia_gpu_operator:feature_discovery_operator:olm:version}"
      configData:
        core:
          sleepInterval: 60s
        sources:
          pci:
            deviceClassWhitelist:
              - "0200"
              - "03"
              - "12"
            deviceLabelFields:
              - "vendor"
      nodeFeatureDiscovery:
        name: nfd-instance
        spec:
          operand:
            imagePullPolicy: IfNotPresent
            servicePort: 12000
